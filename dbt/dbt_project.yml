name: "gloomberg"
version: "1.0.0"
config-version: 2

profile: "gloomberg"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# layering law (02 §2.1): marts -> intermediate -> staging -> source, never skipped.
models:
  gloomberg:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
      serving:
        +materialized: table
