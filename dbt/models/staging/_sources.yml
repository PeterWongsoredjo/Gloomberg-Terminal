version: 2

sources:
  # IDX end-of-day trading summary + index levels. Foreign flow is carried inside
  # daily_trade (ForeignBuy/ForeignSell), so it has no separate upstream feed.
  - name: bronze_idx_summary
    description: "Raw IDX TradingSummary payloads, Hive-partitioned in MinIO Bronze (CT-002)."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 20, period: hour }
      error_after: { count: 30, period: hour }
    tables:
      - name: daily_trade
        description: "IDX daily stock summary (Ringkasan Saham). Raw, untyped envelope."
        meta:
          external_location: "read_json('s3://gloomberg-bronze/idx_summary/daily_trade/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"
      - name: index_level
        description: "IDX daily index summary (IHSG and index levels)."
        meta:
          external_location: "read_json('s3://gloomberg-bronze/idx_summary/index_level/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  - name: bronze_corporate_actions
    description: "IDX share-count-changing corporate actions (GetIssuedHistory)."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 30, period: hour }
      error_after: { count: 48, period: hour }
    tables:
      - name: issued_history
        meta:
          external_location: "read_json('s3://gloomberg-bronze/corporate_actions/issued_history/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  - name: bronze_company_profile
    description: "IDX listed-company profiles: board, sector, listing date."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 48, period: hour }
      error_after: { count: 96, period: hour }
    tables:
      - name: profiles
        meta:
          external_location: "read_json('s3://gloomberg-bronze/company_profile/profiles/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  - name: bronze_index_constituents
    description: "IDX index membership by review period (normalized from the review archive)."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 30, period: day }
      error_after: { count: 120, period: day }
    tables:
      - name: membership
        meta:
          external_location: "read_json('s3://gloomberg-bronze/index_constituents/membership/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  - name: bronze_ksei
    description: "KSEI monthly Master Securities: the ISIN authority for IDX equities."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 40, period: day }
      error_after: { count: 60, period: day }
    tables:
      - name: master_securities
        meta:
          external_location: "read_json('s3://gloomberg-bronze/ksei/master_securities/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  # CT-003 ingestion manifests: the coverage + lineage anchor Silver validates against.
  - name: bronze_manifests
    description: "One CT-003 manifest per ingestion run; carries coverage and status."
    tables:
      - name: manifests
        meta:
          formatter: "template"
          external_location: "read_json('s3://gloomberg-bronze/_manifests/*/*/*/*.json', format='unstructured', records=true, columns={ingest_run_id: 'VARCHAR', source: 'VARCHAR', dataset: 'VARCHAR', trade_date: 'DATE', source_version: 'VARCHAR', status: 'VARCHAR', record_count: 'BIGINT', completed_at: 'TIMESTAMP', quality: 'STRUCT(expected_universe BIGINT, observed_universe BIGINT, missing_tickers VARCHAR[], coverage_ratio DOUBLE)'})"

  # Financial news RSS, normalized to JSON items by the sentiment flow; the agent's
  # news context and stg_news_rss both read this.
  - name: bronze_news_rss
    description: "Financial news RSS items, normalized to JSON items."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 6, period: hour }
      error_after: { count: 12, period: hour }
    tables:
      - name: items
        meta:
          external_location: "read_json('s3://gloomberg-bronze/news_rss/items/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"

  # CT-009 artifacts landed from the agentic Postgres ledger, one dataset per type.
  # The 02 projection turns these into fct_sentiment / fct_insight.
  - name: bronze_agent_artifact
    description: "CT-009 LLM artifacts projected from the agentic ledger into Bronze."
    loaded_at_field: "cast(ingest_date as timestamp)"
    freshness:
      warn_after: { count: 24, period: hour }
      error_after: { count: 48, period: hour }
    tables:
      - name: sentiment
        meta:
          external_location: "read_json('s3://gloomberg-bronze/agent_artifact/sentiment/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"
      - name: article_sentiment
        meta:
          external_location: "{% raw %}read_json('s3://gloomberg-bronze/agent_artifact/article_sentiment/*/*/*.json.zst', hive_partitioning=true, filename=true, columns={{artifact_id: 'VARCHAR', run_id: 'VARCHAR', artifact_type: 'VARCHAR', security_id: 'BIGINT', ticker: 'VARCHAR', window_from: 'DATE', window_to: 'DATE', value: 'STRUCT(item_id VARCHAR, sentiment_score DOUBLE, sentiment_label VARCHAR, drivers VARCHAR[], ticker_sentiments STRUCT(ticker VARCHAR, sentiment_score DOUBLE, sentiment_label VARCHAR, relevance VARCHAR)[], dropped_tickers VARCHAR[], self_confidence DOUBLE)', confidence: 'DOUBLE', quality_flags: 'VARCHAR[]', provider: 'VARCHAR', model: 'VARCHAR', prompt_version: 'VARCHAR', generated_at: 'VARCHAR'}}){% endraw %}"
      - name: insight
        meta:
          external_location: "read_json('s3://gloomberg-bronze/agent_artifact/insight/*/*/*.json.zst', hive_partitioning=true, format='auto', union_by_name=true, filename=true)"
