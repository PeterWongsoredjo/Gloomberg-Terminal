[project]
name = "gloomberg-data-pipeline"
version = "0.1.0"
description = "Gloomberg Terminal medallion glue — Bronze load, Gold publish, Postgres sync (docs/architecture/02)"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7", # TLS-fingerprint client for Cloudflare-protected IDX/KSEI
    "duckdb>=1.1", # Gold publish + postgres-extension sync
    "minio>=7.2", # Bronze object store client
    "zstandard>=0.23", # CT-002 payload compression
    "python-ulid>=2.7", # ingest_run_id / event_id
    "psycopg[binary]>=3.2",
    "pytz>=2026.2",
    "pypdf>=5.1", # reads the text out of filed dividend PDFs
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
