name: gloomberg-orchestration
prefect-version: 3.7.7

# local process worker runs from this service dir, on a VPS, run the worker here too
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $GLOOMBERG_ORCH_DIR }}"

deployments:
  - name: gloomberg-daily
    entrypoint: src/orchestration/flow.py:gloomberg_daily_flow
    description: "The OR-01 daily medallion cycle (guard -> ingest -> gate -> dbt -> promote -> trigger)."
    work_pool:
      name: gloomberg-local        # concurrency limits set by setup_prefect.py
    schedules:
      - cron: "0 17 * * 1-5"        # WIB EOD buffer past the close, guard skips holidays
        timezone: "Asia/Jakarta"
    parameters:
      objective: "daily_sentiment"

  - name: gloomberg-intraday-news
    entrypoint: src/orchestration/flow_intraday.py:intraday_news_flow
    description: "In-session 15-minute news poll: land RSS, project new items, score intraday sentiment."
    work_pool:
      name: gloomberg-local
    schedules:
      - interval: 900              # the session guard makes off-hours ticks a cheap SKIP
        anchor_date: "2026-01-01T09:00:00"
        timezone: "Asia/Jakarta"
