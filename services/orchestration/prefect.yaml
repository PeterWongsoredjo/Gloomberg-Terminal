name: gloomberg-orchestration
prefect-version: 3.7.7

# local process worker runs from this service dir, on a VPS, run the worker here too
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ $GLOOMBERG_ORCH_DIR }}"

deployments:
  - name: gloomberg-daily
    entrypoint: src/orchestration/flow.py:gloomberg_daily_flow
    description: "The daily medallion cycle (guard -> ingest -> registry -> gate -> land -> dbt -> promote -> eod insight). EOD sentiment is a dbt rollup; the one LLM call is the close-of-day insight, which lands and rebuilds itself."
    work_pool:
      name: gloomberg-local        # concurrency limits set by setup_prefect.py
    schedules:
      - cron: "0 17 * * 1-5"        # WIB EOD buffer past the close, guard skips holidays
        timezone: "Asia/Jakarta"

  - name: gloomberg-intraday-news
    entrypoint: src/orchestration/flow_intraday.py:intraday_news_flow
    description: "In-session 15-minute news poll: land RSS, tag against the registry, score every unscored article."
    work_pool:
      name: gloomberg-local
    schedules:
      - interval: 900              # the session guard makes off-hours ticks a cheap SKIP
        anchor_date: "2026-01-01T09:00:00"
        timezone: "Asia/Jakarta"

  - name: gloomberg-intraday-insight
    entrypoint: src/orchestration/flow_intraday_insight.py:intraday_insight_flow
    description: "In-session hourly insight refresh, incremental: only subjects whose articles changed since their last insight."
    work_pool:
      name: gloomberg-local
    schedules:
      - interval: 3600             # ~8 subjects a tick, and a quiet hour dispatches nothing
        anchor_date: "2026-01-01T09:05:00"
        timezone: "Asia/Jakarta"

  - name: gloomberg-resweep
    entrypoint: src/orchestration/flow_sweep.py:idx_resweep_flow
    description: "Hourly retry of the day's blocked IDX fetches. The proxy blocks in stretches, so a later hour is an independent attempt; a day with nothing outstanding stops immediately."
    work_pool:
      name: gloomberg-local
    schedules:
      - cron: "0 18-23 * * 1-5"     # six independent windows after the 17:00 EOD run
        timezone: "Asia/Jakarta"

  - name: gloomberg-backfill
    entrypoint: src/orchestration/flow_backfill.py:backfill_sentiment_flow
    description: "Overnight drain of the unscored article backlog across the retained window, oldest day first."
    work_pool:
      name: gloomberg-local
    schedules:
      - cron: "0 2 * * *"           # ahead of the backup cron, sessions long closed
        timezone: "Asia/Jakarta"
