[project]
name = "gloomberg-orchestration"
version = "0.1.0"
description = "Gloomberg Terminal orchestration — the Prefect daily flow DAG (docs/architecture/03)"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.1",              # hybrid: Cloud/local-server control plane + local worker
    "httpx>=0.27",              # OR-04 agentic trigger client (loopback to backend-api)
    "psycopg[binary]>=3.2",     # OR-06 run-state event sink into Postgres
    "gloomberg-data-pipeline",  # calls the Stage-1 ingest/publish/sync functions
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv.sources]
gloomberg-data-pipeline = { path = "../data-pipeline", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration"]
