# Local infra for the Gloomberg medallion: MinIO Bronze + Postgres serving.
# No architecture doc owns container config, this fills that gap, sized to the
# 8 GB / 4 vCPU box budget (ADR-005). dbt/DuckDB run host-side, not here.
# Bring up: docker compose --env-file ../.env -f docker-compose.yml up -d
name: gloomberg

services:
  # S3-compatible Bronze object store (CT-002 Hive-partitioned raw payloads).
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000" # S3 API, host-mapped gateway (localhost:9000)
      - "127.0.0.1:9001:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # create the gloomberg-bronze bucket, then exit. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_KEY} $${MINIO_SECRET} &&
      mc mb --ignore-existing local/gloomberg-bronze &&
      echo 'bucket gloomberg-bronze ready'
      "
    environment:
      MINIO_KEY: ${MINIO_KEY}
      MINIO_SECRET: ${MINIO_SECRET}

  # Operational/serving state: agg_* projections, app metadata, agent ledger (ADR-001).
  postgres:
    image: postgres:16
    ports:
      # host port is env-driven: 5433 locally (native PG owns 5432), 5432 on the VPS
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gloomberg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gloomberg"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"


  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  pushgateway:
    image: prom/pushgateway:v1.11.3
    profiles: ["monitoring"]
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9091
      - --persistence.file=/data/pushgateway.db
      - --persistence.interval=5m
    volumes:
      - pushgateway_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    network_mode: host
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gloomberg.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  minio_data:
  postgres_data:
  prometheus_data:
  pushgateway_data:
  grafana_data:
