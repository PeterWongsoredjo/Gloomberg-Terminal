# Local infra for the Gloomberg medallion: MinIO Bronze + Postgres serving.
# No architecture doc owns container config, this fills that gap, sized to the
# 8 GB / 4 vCPU box budget (ADR-005). dbt/DuckDB run host-side, not here.
# Bring up: docker compose --env-file ../.env -f docker-compose.yml up -d
name: gloomberg

services:
  # S3-compatible Bronze object store (CT-002 Hive-partitioned raw payloads).
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000" # S3 API, host-mapped gateway (localhost:9000)
      - "127.0.0.1:9001:9001" # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # create the gloomberg-bronze bucket, then exit. Idempotent.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_KEY} $${MINIO_SECRET} &&
      mc mb --ignore-existing local/gloomberg-bronze &&
      echo 'bucket gloomberg-bronze ready'
      "
    environment:
      MINIO_KEY: ${MINIO_KEY}
      MINIO_SECRET: ${MINIO_SECRET}

  # Operational/serving state: agg_* projections, app metadata, agent ledger (ADR-001).
  postgres:
    image: postgres:16
    ports:
      # host port is env-driven: 5433 locally (native PG owns 5432), 5432 on the VPS
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gloomberg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gloomberg"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.5"

volumes:
  minio_data:
  postgres_data:
